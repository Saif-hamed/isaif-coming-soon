<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>قريباً — [isaif.om]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-primary: #000000;
      --bg-secondary: #001100;
      --accent-green: #00FF00;
      --accent-cyan: #00FFFF;
      --accent-magenta: #FF00FF;
      --accent-amber: #FFB000;
      --text-primary: #00FF00;
      --text-secondary: #00FFFF;
      --border-color: #333333;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    
    body {
      font-family: 'Orbitron', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        radial-gradient(circle at 20% 80%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
        linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Pixelated grid background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -1;
      animation: grid-move 20s linear infinite;
    }
    
    /* CRT scan lines effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 0, 0.03) 2px,
        rgba(0, 255, 0, 0.03) 4px
      );
      z-index: -1;
      pointer-events: none;
    }
    
    @keyframes grid-move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(20px, 20px); }
    }
    
    .card {
      max-width: 900px;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      padding: 32px;
      border: 3px solid var(--accent-green);
      border-radius: 0;
      text-align: center;
      position: relative;
      box-shadow: 
        0 0 20px var(--accent-green),
        inset 0 0 20px rgba(0, 255, 0, 0.1);
      backdrop-filter: blur(2px);
    }
    
    /* Pixelated corner decorations */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--accent-green);
    }
    
    .card::before {
      top: -3px;
      left: -3px;
      border-right: 3px solid var(--bg-primary);
      border-bottom: 3px solid var(--bg-primary);
    }
    
    .card::after {
      bottom: -3px;
      right: -3px;
      border-left: 3px solid var(--bg-primary);
      border-top: 3px solid var(--bg-primary);
    }
    
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: var(--accent-green);
      text-shadow: 
        0 0 10px var(--accent-green),
        0 0 20px var(--accent-green),
        0 0 30px var(--accent-green);
      animation: glow-pulse 2s ease-in-out infinite alternate;
    }
    
    @keyframes glow-pulse {
      from { 
        text-shadow: 
          0 0 10px var(--accent-green),
          0 0 20px var(--accent-green),
          0 0 30px var(--accent-green);
      }
      to { 
        text-shadow: 
          0 0 20px var(--accent-green),
          0 0 30px var(--accent-green),
          0 0 40px var(--accent-green);
      }
    }
    
    p.lead {
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
    }
    
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    
    .btn {
      padding: 12px 20px;
      border: 2px solid var(--accent-green);
      background: transparent;
      color: var(--accent-green);
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      position: relative;
      transition: all 0.3s ease;
      border-radius: 0;
      cursor: pointer;
      display: inline-block;
    }
    
    .btn:hover {
      background: var(--accent-green);
      color: var(--bg-primary);
      box-shadow: 
        0 0 15px var(--accent-green),
        inset 0 0 15px rgba(0, 255, 0, 0.3);
      transform: translateY(-2px);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    /* Pixelated button corners */
    .btn::before,
    .btn::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent-green);
    }
    
    .btn::before {
      top: -2px;
      left: -2px;
    }
    
    .btn::after {
      bottom: -2px;
      right: -2px;
    }
    
    .btn:hover::before,
    .btn:hover::after {
      background: var(--bg-primary);
    }
    
    small {
      display: block;
      margin-top: 20px;
      opacity: 0.7;
      color: var(--accent-cyan);
      font-size: 0.8rem;
    }
    
    /* Blinking cursor effect */
    .cursor-blink {
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    
    /* Pixel art icons */
    .pixel-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    .icon-email {
      background: var(--accent-green);
      position: relative;
    }
    
    .icon-email::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      border: 2px solid var(--bg-primary);
    }
    
    .icon-linkedin {
      background: var(--accent-cyan);
      position: relative;
    }
    
    .icon-linkedin::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      background: var(--bg-primary);
    }
    
    .icon-github {
      background: var(--accent-magenta);
      position: relative;
    }
    
    .icon-github::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      background: var(--bg-primary);
      border-radius: 50%;
    }
    
    /* Programming code tiles animation */
    .code-tile {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--accent-green);
      text-shadow: 0 0 5px var(--accent-green);
      opacity: 0;
      animation: tile-fade 3s ease-out forwards;
      user-select: none;
      background: rgba(0, 0, 0, 0.8);
      padding: 2px 4px;
      border: 1px solid var(--accent-green);
      border-radius: 0;
      white-space: nowrap;
    }
    
    @keyframes tile-fade {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(0.8);
      }
    }
    
    /* Different colors for different code types */
    .code-tile.html { color: #FF6B6B; text-shadow: 0 0 5px #FF6B6B; border-color: #FF6B6B; }
    .code-tile.css { color: #4ECDC4; text-shadow: 0 0 5px #4ECDC4; border-color: #4ECDC4; }
    .code-tile.js { color: #FFE66D; text-shadow: 0 0 5px #FFE66D; border-color: #FFE66D; }
    .code-tile.python { color: #95E1D3; text-shadow: 0 0 5px #95E1D3; border-color: #95E1D3; }
    .code-tile.sql { color: #F38BA8; text-shadow: 0 0 5px #F38BA8; border-color: #F38BA8; }
    .code-tile.git { color: #FFB6C1; text-shadow: 0 0 5px #FFB6C1; border-color: #FFB6C1; }
    
    /* Responsive design */
    @media (min-width: 700px) {
      h1 { font-size: 2.2rem; }
      p.lead { font-size: 1.1rem; }
    }
    
    @media (max-width: 600px) {
      .links {
        flex-direction: column;
        align-items: center;
      }
      .btn {
        width: 200px;
      }
      .code-tile {
        font-size: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>قريباً<span class="cursor-blink">_</span></h1>
    <p class="lead">أعمل الآن على بناء موقعي المهني. شكرًا لزيارتك — يمكنك التواصل معي عبر الروابط أدناه.</p>

    <div class="links">
      <a class="btn" href="mailto:saifh.hamami@gmail.com">
        <span class="pixel-icon icon-email"></span>مراسلة
      </a>
      <a class="btn" href="https://www.linkedin.com/in/saif-al-hamami" target="_blank" rel="noopener">
        <span class="pixel-icon icon-linkedin"></span>LinkedIn
      </a>
      <a class="btn" href="https://github.com/Saif-hamed" target="_blank" rel="noopener">
        <span class="pixel-icon icon-github"></span>GitHub
      </a>
    </div>

    <small>Saif Al Hamami / Full Stack Developer<span class="cursor-blink">_</span></small>
  </div>

  <script>
    // Programming code snippets for the mouse animation
    const codeSnippets = {
      html: [
        '<div>', '</div>', '<span>', '<p>', '<h1>', '<a href>', '<img src>', '<button>', '<input>', '<form>',
        '<nav>', '<header>', '<footer>', '<section>', '<article>', '<aside>', '<main>', '<canvas>'
      ],
      css: [
        'color: #fff', 'background: #000', 'margin: 0', 'padding: 10px', 'border: 1px', 'display: flex',
        'position: absolute', 'width: 100%', 'height: 100vh', 'font-size: 16px', 'text-align: center',
        'border-radius: 5px', 'box-shadow: 0 0', 'transition: all', 'animation: fade', '@media (max-width)',
        'grid-template-columns', 'flex-direction: column', 'justify-content: center', 'align-items: center'
      ],
      js: [
        'function() {}', 'const x = 0', 'let y = []', 'if (true) {}', 'for (let i = 0)', 'console.log()',
        'document.querySelector', 'addEventListener', 'setTimeout(() =>', 'Promise.resolve', 'async function',
        'try { } catch', 'return false', 'JSON.parse()', 'Math.random()', 'Date.now()', 'localStorage.setItem',
        'fetch(url)', 'then(response =>', 'catch(error =>'
      ],
      python: [
        'def function():', 'import os', 'from typing import', 'if __name__ == "__main__":', 'try: except:',
        'for i in range():', 'list.append()', 'dict.get()', 'str.split()', 'len(array)', 'print("hello")',
        'class MyClass:', 'self.variable =', 'return True', 'lambda x: x', 'with open() as f:', 'json.loads()',
        'requests.get()', 'pandas.DataFrame', 'numpy.array'
      ],
      sql: [
        'SELECT * FROM', 'WHERE id = 1', 'INSERT INTO table', 'UPDATE table SET', 'DELETE FROM table',
        'JOIN table ON', 'GROUP BY column', 'ORDER BY name', 'LIMIT 10', 'COUNT(*)', 'SUM(price)',
        'AVG(rating)', 'MAX(date)', 'MIN(value)', 'DISTINCT name', 'HAVING count > 5', 'UNION SELECT',
        'CREATE TABLE', 'ALTER TABLE', 'DROP TABLE'
      ],
      git: [
        'git init', 'git add .', 'git commit -m', 'git push origin', 'git pull origin', 'git status',
        'git log --oneline', 'git branch', 'git checkout', 'git merge', 'git clone', 'git remote add',
        'git fetch', 'git rebase', 'git stash', 'git diff', 'git reset --hard', 'git revert'
      ]
    };

    let mouseX = 0;
    let mouseY = 0;
    let animationTimeout;

    // Track mouse movement
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      // Clear existing timeout
      clearTimeout(animationTimeout);
      
      // Start animation with delay
      animationTimeout = setTimeout(() => {
        createCodeTile();
      }, 100);
    });

    function createCodeTile() {
      // Get random code type
      const codeTypes = Object.keys(codeSnippets);
      const randomType = codeTypes[Math.floor(Math.random() * codeTypes.length)];
      
      // Get random snippet from that type
      const snippets = codeSnippets[randomType];
      const randomSnippet = snippets[Math.floor(Math.random() * snippets.length)];
      
      // Create tile element
      const tile = document.createElement('div');
      tile.className = `code-tile ${randomType}`;
      tile.textContent = randomSnippet;
      
      // Position tile near mouse with some randomness
      const offsetX = (Math.random() - 0.5) * 100;
      const offsetY = (Math.random() - 0.5) * 100;
      
      tile.style.left = (mouseX + offsetX) + 'px';
      tile.style.top = (mouseY + offsetY) + 'px';
      
      // Add to page
      document.body.appendChild(tile);
      
      // Remove tile after animation completes
      setTimeout(() => {
        if (tile.parentNode) {
          tile.parentNode.removeChild(tile);
        }
      }, 3000);
    }

    // Add some initial tiles on page load
    window.addEventListener('load', () => {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          createCodeTile();
        }, i * 500);
      }
    });

    // Create tiles periodically even without mouse movement
    setInterval(() => {
      if (Math.random() < 0.3) { // 30% chance every 2 seconds
        mouseX = Math.random() * window.innerWidth;
        mouseY = Math.random() * window.innerHeight;
        createCodeTile();
      }
    }, 2000);
  </script>
</body>
</html>
