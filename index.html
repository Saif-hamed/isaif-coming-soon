<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>قريباً — [isaif.om]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-primary: #000000;
      --bg-secondary: #001100;
      --accent-green: #00FF41;
      --accent-cyan: #00FFFF;
      --accent-magenta: #FF00FF;
      --accent-amber: #FFB000;
      --text-primary: #00FF41;
      --text-secondary: #00FFFF;
      --border-color: #333333;
      --glow-primary: rgba(0, 255, 65, 0.4);
      --glow-secondary: rgba(0, 255, 255, 0.3);
      --shadow-deep: rgba(0, 0, 0, 0.8);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        radial-gradient(circle at 20% 80%, var(--glow-primary) 0%, transparent 60%),
        radial-gradient(circle at 80% 20%, var(--glow-secondary) 0%, transparent 60%),
        linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated grid background with soft glow */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 65, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      animation: grid-move 30s linear infinite;
      filter: blur(0.5px);
    }
    
    /* Animated scanlines with subtle glow */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 255, 65, 0.02) 3px,
        rgba(0, 255, 65, 0.02) 4px
      );
      z-index: -1;
      pointer-events: none;
      animation: scanline-move 2s linear infinite;
    }
    
    /* Viewport frame */
    .viewport-frame {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      border: 1px solid var(--accent-green);
      border-radius: 8px;
      z-index: 10;
      pointer-events: none;
      box-shadow: 
        inset 0 0 20px var(--glow-primary),
        0 0 40px var(--glow-primary);
      animation: frame-pulse 4s ease-in-out infinite alternate;
    }
    
    @keyframes grid-move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }
    
    @keyframes scanline-move {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }
    
    @keyframes frame-pulse {
      0% { 
        box-shadow: 
          inset 0 0 20px var(--glow-primary),
          0 0 40px var(--glow-primary);
      }
      100% { 
        box-shadow: 
          inset 0 0 30px var(--glow-primary),
          0 0 60px var(--glow-primary);
      }
    }
    
    .card {
      max-width: 900px;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 48px 40px;
      border: 1px solid var(--accent-green);
      border-radius: 12px;
      text-align: center;
      position: relative;
      box-shadow: 
        0 0 40px var(--glow-primary),
        inset 0 0 30px rgba(0, 255, 65, 0.05),
        0 8px 32px var(--shadow-deep);
      backdrop-filter: blur(8px);
      animation: card-glow 3s ease-in-out infinite alternate;
      transform: translateY(0);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 0 60px var(--glow-primary),
        inset 0 0 40px rgba(0, 255, 65, 0.08),
        0 12px 48px var(--shadow-deep);
    }
    
    /* Cyber corner decorations */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent-green);
      border-radius: 4px;
      box-shadow: 0 0 12px var(--glow-primary);
    }
    
    .card::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }
    
    .card::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }
    
    @keyframes card-glow {
      0% { 
        box-shadow: 
          0 0 40px var(--glow-primary),
          inset 0 0 30px rgba(0, 255, 65, 0.05),
          0 8px 32px var(--shadow-deep);
      }
      100% { 
        box-shadow: 
          0 0 60px var(--glow-primary),
          inset 0 0 40px rgba(0, 255, 65, 0.08),
          0 8px 32px var(--shadow-deep);
      }
    }
    
    h1 {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 24px;
      color: var(--accent-green);
      text-shadow: 
        0 0 20px var(--glow-primary),
        0 0 40px var(--glow-primary),
        0 0 60px var(--glow-primary);
      animation: glow-pulse 3s ease-in-out infinite alternate;
      position: relative;
      letter-spacing: 2px;
    }
    
    /* Animated underline for Arabic text */
    h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
      box-shadow: 0 0 10px var(--glow-primary);
      animation: underline-load 4s ease-in-out infinite;
    }
    
    @keyframes glow-pulse {
      0% { 
        text-shadow: 
          0 0 20px var(--glow-primary),
          0 0 40px var(--glow-primary),
          0 0 60px var(--glow-primary);
      }
      100% { 
        text-shadow: 
          0 0 30px var(--glow-primary),
          0 0 60px var(--glow-primary),
          0 0 80px var(--glow-primary);
      }
    }
    
    @keyframes underline-load {
      0%, 100% { width: 0; opacity: 0; }
      50% { width: 80%; opacity: 1; }
    }
    
    p.lead {
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 1.1rem;
      line-height: 1.8;
      opacity: 0.95;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--glow-secondary);
    }
    
    .links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    
    .btn {
      padding: 16px 32px;
      border: 1px solid var(--accent-green);
      background: rgba(0, 255, 65, 0.05);
      color: var(--accent-green);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      box-shadow: 
        0 0 20px var(--glow-primary),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--glow-primary), transparent);
      transition: left 0.6s ease;
    }
    
    .btn:hover {
      background: rgba(0, 255, 65, 0.1);
      color: var(--accent-green);
      box-shadow: 
        0 0 40px var(--glow-primary),
        inset 0 0 30px rgba(0, 255, 65, 0.2),
        0 8px 24px var(--shadow-deep);
      transform: translateY(-3px) scale(1.05);
      border-color: var(--accent-green);
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn:active {
      transform: translateY(-1px) scale(1.02);
    }
    
    /* Modern cyber button corners */
    .btn::after {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      background: linear-gradient(45deg, var(--accent-green), transparent, var(--accent-green));
      border-radius: 8px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .btn:hover::after {
      opacity: 0.3;
    }
    
    small {
      display: block;
      margin-top: 32px;
      opacity: 0.8;
      color: var(--accent-cyan);
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 0 8px var(--glow-secondary);
    }
    
    /* Enhanced blinking cursor effect */
    .cursor-blink {
      animation: blink 1.2s infinite;
      color: var(--accent-green);
      text-shadow: 0 0 10px var(--glow-primary);
    }
    
    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    
    /* Modern cyber icons */
    .pixel-icon {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 4px;
      position: relative;
      box-shadow: 0 0 8px var(--glow-primary);
    }
    
    .icon-email {
      background: linear-gradient(135deg, var(--accent-green), rgba(0, 255, 65, 0.8));
      border: 1px solid var(--accent-green);
    }
    
    .icon-email::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      border: 1px solid var(--bg-primary);
      border-radius: 2px;
    }
    
    .icon-linkedin {
      background: linear-gradient(135deg, var(--accent-cyan), rgba(0, 255, 255, 0.8));
      border: 1px solid var(--accent-cyan);
    }
    
    .icon-linkedin::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      background: var(--bg-primary);
      border-radius: 2px;
    }
    
    .icon-github {
      background: linear-gradient(135deg, var(--accent-magenta), rgba(255, 0, 255, 0.8));
      border: 1px solid var(--accent-magenta);
    }
    
    .icon-github::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      background: var(--bg-primary);
      border-radius: 50%;
    }
    
    
    /* Terminal console logs */
    .console-logs {
      position: fixed;
      top: 40px;
      left: 40px;
      right: 40px;
      height: 60px;
      overflow: hidden;
      z-index: 5;
      pointer-events: none;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--accent-cyan);
      opacity: 0.3;
    }
    
    .console-log {
      position: absolute;
      white-space: nowrap;
      animation: console-scroll 15s linear infinite;
      text-shadow: 0 0 5px var(--glow-secondary);
    }
    
    @keyframes console-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    
    /* Responsive design */
    @media (min-width: 768px) {
      h1 { font-size: 3rem; }
      p.lead { font-size: 1.2rem; }
      .card { padding: 56px 48px; }
    }
    
    @media (max-width: 767px) {
      body { padding: 16px; }
      .viewport-frame {
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
      }
      .console-logs {
        top: 20px;
        left: 20px;
        right: 20px;
        height: 40px;
        font-size: 8px;
      }
      h1 { font-size: 2rem; }
      p.lead { font-size: 1rem; }
      .card { padding: 32px 24px; }
      .links {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .btn {
        width: 240px;
        padding: 14px 28px;
        font-size: 0.9rem;
      }
    }
    
    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      .card { padding: 24px 20px; }
      .btn { width: 200px; padding: 12px 24px; }
    }
  </style>
</head>
<body>
  <!-- Viewport Frame -->
  <div class="viewport-frame"></div>
  
  <!-- Console Logs -->
  <div class="console-logs" id="console-logs"></div>
  
  
  <!-- Main Content -->
  <div class="card">
    <h1>قريباً<span class="cursor-blink">_</span></h1>
    <p class="lead">أعمل الآن على بناء موقعي المهني. شكرًا لزيارتك — يمكنك التواصل معي عبر الروابط أدناه</p>

    <div class="links">
      <a class="btn" href="mailto:saifh.hamami@gmail.com">
        <span class="pixel-icon icon-email"></span>مراسلة
      </a>
      <a class="btn" href="https://www.linkedin.com/in/saif-al-hamami" target="_blank" rel="noopener">
        <span class="pixel-icon icon-linkedin"></span>LinkedIn
      </a>
      <a class="btn" href="https://github.com/Saif-hamed" target="_blank" rel="noopener">
        <span class="pixel-icon icon-github"></span>GitHub
      </a>
    </div>

    <small>Saif Al Hamami / Full Stack Developer<span class="cursor-blink">_</span></small>
  </div>

  <script>

    // Console logs system
    const consoleMessages = [
      '> Initializing system...',
      '> Loading cyber-terminal interface...',
      '> Establishing secure connection...',
      '> Welcome to isaif.om',
      '> Full Stack Developer online',
      '> Ready for deployment',
      '> System status: ACTIVE',
      '> Terminal interface: READY',
      '> Contact protocols: ENABLED',
      '> Professional portfolio: IN DEVELOPMENT'
    ];

    function createConsoleLog() {
      const consoleLogs = document.getElementById('console-logs');
      if (!consoleLogs) return;
      
      const message = consoleMessages[Math.floor(Math.random() * consoleMessages.length)];
      const logElement = document.createElement('div');
      logElement.className = 'console-log';
      logElement.textContent = message;
      
      // Randomize vertical position
      const randomTop = Math.random() * 40;
      logElement.style.top = randomTop + 'px';
      
      consoleLogs.appendChild(logElement);
      
      // Remove after animation
      setTimeout(() => {
        if (logElement.parentNode) {
          logElement.parentNode.removeChild(logElement);
        }
      }, 15000);
    }

    // Initialize console logs
    function initConsoleLogs() {
      // Create initial logs
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          createConsoleLog();
        }, i * 2000);
      }
      
      // Continue creating logs periodically
      setInterval(() => {
        if (Math.random() < 0.4) { // 40% chance every 8 seconds
          createConsoleLog();
        }
      }, 8000);
    }

    // Smooth fade-in animation for main content
    function initFadeIn() {
      const card = document.querySelector('.card');
      if (card) {
        card.style.opacity = '0';
        card.style.transform = 'translateY(30px)';
        
        setTimeout(() => {
          card.style.transition = 'all 1s ease-out';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, 300);
      }
    }

    // Initialize all systems
    window.addEventListener('load', () => {
      initCustomCursor();
      initConsoleLogs();
      initFadeIn();
    });

    // Handle page visibility for performance
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // Pause animations when tab is not visible
        document.body.style.animationPlayState = 'paused';
      } else {
        document.body.style.animationPlayState = 'running';
      }
    });

    // Add keyboard accessibility
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        // Show default cursor when navigating with keyboard
        if (cursor) cursor.style.opacity = '0';
      }
    });

    document.addEventListener('mousedown', () => {
      // Hide cursor on click for better UX
      if (cursor) cursor.style.opacity = '0';
    });

    document.addEventListener('mouseup', () => {
      // Show cursor after click
      setTimeout(() => {
        if (cursor) cursor.style.opacity = '1';
      }, 100);
    });
  </script>
</body>
</html>
