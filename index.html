<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>قريباً — [isaif.om]</title>
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#eab308}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial;min-height:100vh;
         display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),#07101a);color:#fff;padding:24px}
    .card{max-width:900px;width:100%;background:rgba(255,255,255,0.03);padding:32px;border-radius:12px;backdrop-filter:blur(6px);
          box-shadow:0 6px 30px rgba(2,6,23,0.6);text-align:center}
    h1{font-size:2.2rem;margin-bottom:8px}
    p.lead{opacity:.85;margin-bottom:18px}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    .btn{padding:10px 16px;border-radius:10px;background:var(--accent);color:#07101a;font-weight:600;text-decoration:none}
    small{display:block;margin-top:14px;opacity:.7}
    @media(min-width:700px){h1{font-size:2.6rem}}
  </style>
</head>
<body>
  <div class="card">
    <h1>قريباً ✨</h1>
    <p class="lead">أعمل الآن على بناء موقعي المهني. شكرًا لزيارتك — يمكنك التواصل معي عبر الروابط أدناه.</p>

    <div class="links">
      <a class="btn" href="mailto:saifh.hamami@gmail.com">✉️ مراسلة</a>
      <a class="btn" href="https://www.linkedin.com/in/saif-al-hamami" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn" href="https://github.com/Saif-hamed" target="_blank" rel="noopener">GitHub</a>
    </div>

    <small>Saif Al Hamami / Full Stack Developer</small>
  </div>
</body>
</html>
